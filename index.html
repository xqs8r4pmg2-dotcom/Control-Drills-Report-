<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17191c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="加工条件">
<title>加工条件変更履歴 — 6GR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap');

:root{
  --bg: #17191c;
  --panel: #202327;
  --panel-2: #262a2f;
  --line: #34383e;
  --amber: #ffb100;
  --amber-dim: #7a5c14;
  --blue: #4fa3ff;
  --teal: #3ecfb4;
  --text: #eceae5;
  --muted: #8b9099;
  --danger: #ff5d5d;
  --good: #5ad18a;
}
*{ box-sizing:border-box; }
html{ color-scheme: dark; }
html,body{ margin:0; padding:0; }
body{
  background: var(--bg);
  color: var(--text);
  font-family: 'IBM Plex Mono', 'Noto Sans JP', monospace;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}
.wrap{ max-width: 760px; margin: 0 auto; padding: 18px 16px 40px; }

/* ---- cabeçalho ---- */
header{
  display:flex; align-items:center; gap:12px;
  padding-bottom: 14px; margin-bottom: 16px;
  border-bottom: 2px solid var(--teal);
}
.badge{
  width:42px; height:42px; flex:none;
  border:2px solid var(--teal); border-radius:6px;
  display:flex; align-items:center; justify-content:center;
  color: var(--teal); font-family:'Noto Sans JP',sans-serif; font-weight:700; font-size:20px;
}
.htext{ flex:1; min-width:0; }
.htext h1{
  margin:0; font-family:'Oswald','Noto Sans JP',sans-serif; font-weight:700;
  font-size:18px; letter-spacing:0.3px;
}
.htext p{ margin:2px 0 0; color: var(--muted); font-size:11px; }
.langswitch{ display:flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; flex:none; }
.langswitch button{
  background: var(--panel); color: var(--muted); border:none;
  font-family:'Noto Sans JP',sans-serif; font-size:12px; font-weight:600;
  padding: 9px 12px; cursor:pointer;
}
.langswitch button.active{ background: var(--teal); color:#10201d; }

/* ---- barra utilitária ---- */
.util-bar{ display:grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap:8px; margin-bottom: 10px; }
.util-btn{
  background: var(--panel); border:1px solid var(--line); color: var(--muted);
  font-family: inherit; font-size:12px; font-weight:600;
  padding: 12px 4px; border-radius: 8px; cursor:pointer;
}
.util-btn.report{ color: var(--blue); border-color: rgba(79,163,255,0.4); }
.backup-status{
  width:100%; display:block;
  background: var(--panel); border:1px solid var(--line); color: var(--muted);
  font-family: inherit; font-size: 12px; font-weight:600;
  padding: 10px 12px; border-radius: 8px; margin-bottom: 16px; cursor:pointer; text-align:center;
}
.backup-status.warn{ color: var(--amber); border-color: var(--amber); background: rgba(255,177,0,0.08); }
.backup-status.danger{ color: var(--danger); border-color: rgba(255,93,93,0.6); background: rgba(255,93,93,0.08); }

/* ---- cartão de formulário ---- */
.card{
  background: var(--panel); border:1px solid var(--line); border-radius: 10px;
  padding: 16px; margin-bottom: 16px;
}
.card.form{ border: 2px solid rgba(62,207,180,0.5); }
.card-title{
  margin: 0 0 14px; font-family:'Oswald','Noto Sans JP',sans-serif;
  font-size: 13px; font-weight:600; letter-spacing:1px; text-transform: uppercase; color: var(--teal);
}
.field{ margin-bottom: 14px; }
.field > label, .field-label{
  display:block; font-size: 11.5px; color: var(--muted); margin-bottom: 6px;
}
.field input[type="number"], .field input[type="text"], .field input[type="datetime-local"],
.field input[type="month"], .field select, .field textarea{
  width:100%; background:#0d0f11; border:1px solid var(--line); color: var(--text);
  font-family: inherit; font-size: 16px; padding: 11px; border-radius: 6px; outline:none;
}
.field textarea{ min-height: 84px; resize: vertical; font-family: 'Noto Sans JP', 'IBM Plex Mono', sans-serif; line-height: 1.5; }
.field input:focus, .field textarea:focus, .field select:focus{ border-color: var(--teal); }
.hint{ font-size: 11px; color: var(--muted); margin-top: 6px; }

.toggle-row{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:8px; }
.toggle{
  min-height: 52px; background:#0d0f11; border:1px solid var(--line); color: var(--muted);
  border-radius: 8px; font-family:'Oswald','Noto Sans JP',sans-serif; font-size: 18px; font-weight:700;
  letter-spacing: 0.5px; cursor:pointer;
}
.toggle.on{ background: var(--teal); border-color: var(--teal); color:#10201d; }
.toggle.person{ font-family:'Noto Sans JP',sans-serif; font-size: 16px; }

.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top: 8px; }
.chips-label{ width:100%; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.chip{
  background: var(--panel-2); border:1px solid var(--line); color: var(--text);
  font-family:'Noto Sans JP',sans-serif; font-size: 13px;
  padding: 8px 11px; border-radius: 16px; cursor:pointer; max-width: 100%;
  overflow:hidden; text-overflow: ellipsis; white-space: nowrap;
}
.chip.fav{ border-color: rgba(255,177,0,0.5); }
.chip-tool{
  background: transparent; border:1px dashed var(--line); color: var(--muted);
  font-family: inherit; font-size: 12px; padding: 8px 11px; border-radius: 16px; cursor:pointer;
}

.dt-line{ display:flex; align-items:center; gap:8px; }
.dt-now{ flex:1; font-size: 13px; color: var(--muted); }
.dt-toggle{
  background: transparent; border:1px solid var(--line); border-radius: 6px;
  color: var(--muted); font-family: inherit; font-size: 12px; padding: 9px 12px; cursor:pointer;
}
.dt-toggle.on{ border-color: var(--blue); color: var(--blue); }
.dt-custom{ margin-top: 8px; }
.dt-custom.hidden{ display:none; }

.btn{
  width:100%; padding: 15px; border-radius: 8px; border:none; cursor:pointer;
  font-family: inherit; font-size: 15px; font-weight:700; letter-spacing: 0.5px; text-transform: uppercase;
}
.btn.primary{ background: var(--teal); color:#10201d; }
.btn.ghost{ background: transparent; border:1px solid var(--line); color: var(--muted); }
.btn.danger{ background: transparent; border:1px solid rgba(255,93,93,0.5); color: var(--danger); }
.btn-row{ display:flex; gap:10px; }
.btn-row .btn{ flex:1; }

/* ---- seletor de mês próprio (o campo nativo segue o idioma do aparelho) ---- */
.month-nav{ display:flex; align-items:center; gap:8px; margin-bottom: 6px; }
.month-nav button{
  flex:none; width:52px; height:48px; background: var(--panel); border:1px solid var(--line);
  color: var(--text); border-radius: 8px; font-size: 18px; cursor:pointer;
}
.month-nav .m-label{
  flex:1; text-align:center; font-family:'Oswald','Noto Sans JP',sans-serif;
  font-size: 18px; font-weight:600; letter-spacing: 0.5px;
}
.month-nav.light button{ background:#fff; border-color:#999; color:#000; }
.month-nav.light .m-label{ color:#000; }
.list-count{ display:block; text-align:center; font-size: 12px; color: var(--muted); margin-bottom: 6px; }

/* ---- lista ---- */
.day-title{
  font-size: 12px; color: var(--teal); font-weight:700; letter-spacing: 0.5px;
  margin: 16px 0 8px; padding-bottom: 4px; border-bottom: 1px dashed var(--line);
}
.entry{
  background: var(--panel); border:1px solid var(--line); border-radius: 10px;
  padding: 12px 14px; margin-bottom: 8px;
}
.entry-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom: 6px; }
.entry-time{ font-size: 14px; font-weight:700; }
.mc-badge{
  font-size: 11px; font-weight:700; color:#10201d; background: var(--teal);
  border-radius: 5px; padding: 2px 7px;
}
.entry-meta{ font-size: 12px; color: var(--muted); }
.entry-meta b{ color: var(--text); }
.entry-content{
  font-family: 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word; margin: 4px 0 10px;
}
.entry-actions{ display:flex; gap:8px; }
.entry-actions button{
  flex:1; background: transparent; border-radius: 6px; padding: 9px;
  font-family: inherit; font-size: 12px; font-weight:700; cursor:pointer;
}
.entry-actions .e-edit{ color: var(--blue); border:1px solid rgba(79,163,255,0.4); }
.entry-actions .e-del{ color: var(--danger); border:1px solid rgba(255,93,93,0.35); }
.empty{ text-align:center; color: var(--muted); font-size: 13px; padding: 28px 10px; white-space: pre-line; }

/* ---- configurações ---- */
details.card summary{
  cursor:pointer; list-style:none; font-family:'Oswald','Noto Sans JP',sans-serif;
  font-size: 13px; font-weight:600; letter-spacing:1px; text-transform: uppercase; color: var(--muted);
}
details.card summary::-webkit-details-marker{ display:none; }
details.card[open] summary{ margin-bottom: 14px; color: var(--text); }
.grid2{ display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.fav-item{
  display:flex; align-items:center; gap:8px; padding: 8px 10px; margin-bottom: 6px;
  background:#0d0f11; border:1px solid var(--line); border-radius: 6px;
  font-family:'Noto Sans JP',sans-serif; font-size: 13px;
}
.fav-item span{ flex:1; min-width:0; word-break: break-word; }
.fav-item button{
  flex:none; background: transparent; border:1px solid rgba(255,93,93,0.35); color: var(--danger);
  border-radius: 6px; padding: 6px 10px; font-family: inherit; font-size: 12px; cursor:pointer;
}

footer{ text-align:center; color: #5b6068; font-size: 11px; margin-top: 24px; }
.app-version{ text-align:center; color: var(--muted); font-size: 11px; margin-top: 6px; }

/* ---- aviso rápido ---- */
.toast{
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: var(--good); color:#0d1f14; font-weight:700; font-size: 14px;
  padding: 12px 20px; border-radius: 10px; opacity: 0; pointer-events:none;
  transition: opacity 0.2s; z-index: 50;
}
.toast.show{ opacity: 1; }

/* ---- modal ---- */
.overlay{
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display:none; align-items:flex-start; justify-content:center;
  padding: 24px 12px; overflow-y:auto; z-index: 40;
}
.overlay.open{ display:flex; }
.modal{
  width:100%; max-width: 560px; background: var(--panel);
  border: 2px solid var(--blue); border-radius: 12px; padding: 16px;
}

/* ---- relatório (folha A4) ---- */
#reportArea{ display:none; background:#fff; color:#000; min-height:100vh; padding: 14px; }
body.printing{ background:#fff; }
body.printing > .wrap, body.printing .overlay, body.printing .toast{ display:none !important; }
body.printing #reportArea{ display:block; }
.report-toolbar{ display:flex; gap:10px; margin-bottom: 12px; flex-wrap:wrap; }
.report-toolbar button{
  flex:1; min-width: 130px; padding: 13px; border-radius: 8px; border:none; cursor:pointer;
  font-family: 'IBM Plex Mono','Noto Sans JP',sans-serif; font-size: 13px; font-weight:700;
}
.report-toolbar .r-print{ background: var(--teal); color:#10201d; }
.report-toolbar .r-close{ background:#e8e8e8; color:#333; }
.report-month{
  display:flex; align-items:center; gap:8px; margin-bottom: 12px;
  font-family: Arial, 'Noto Sans JP', sans-serif; font-size: 13px; font-weight:700; color:#333;
}
.report-month input{
  font-size: 16px; padding: 8px; border:1px solid #999; border-radius: 6px; background:#fff; color:#000;
}
.sheet{
  font-family: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', sans-serif;
  color:#000; max-width: 190mm; margin: 0 auto 18px;
}
.sheet-title{ text-align:center; font-size: 17px; font-weight:700; letter-spacing: 1px; margin: 4px 0 8px; }
.sheet-head{ display:flex; justify-content:space-between; align-items:flex-end; font-size: 12px; margin-bottom: 4px; }
.sheet-head .partno{ border-bottom: 1px solid #000; padding-bottom: 1px; }
.sheet table{ width:100%; border-collapse: collapse; table-layout: fixed; font-size: 11px; }
.sheet th, .sheet td{ border: 1px solid #000; padding: 2px 4px; vertical-align: middle; }
.sheet thead{ display: table-header-group; }
.sheet th{ font-weight: 600; text-align:center; background:#f2f2f2; }
.sheet td{ height: 7mm; }
.sheet td.c{ text-align:center; }
.sheet td.r{ text-align:right; }
.sheet td.content{ white-space: pre-wrap; word-break: break-word; }
.sheet-foot{ display:flex; justify-content:space-between; font-size: 10px; margin-top: 4px; color:#333; }
.col-mc{ width: 7%; } .col-no{ width: 14%; } .col-date{ width: 9%; }
.col-time{ width: 9%; } .col-person{ width: 11%; } .col-content{ width: 43%; }

@media print{
  @page{ size: A4 portrait; margin: 10mm; }
  .no-print{ display:none !important; }
  #reportArea{ padding:0; min-height: 0; }
  .sheet{ max-width: none; margin: 0; page-break-after: always; break-after: page; }
  .sheet:last-child{ page-break-after: auto; break-after: auto; }
  .sheet th{ -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="badge">記</div>
    <div class="htext">
      <h1 id="hTitle">—</h1>
      <p id="hSub">—</p>
    </div>
    <div class="langswitch">
      <button id="btn-pt">PT</button>
      <button id="btn-ja">日本語</button>
    </div>
  </header>

  <div class="util-bar">
    <button class="util-btn" id="btnBackup" data-i18n="btnBackup">⬇ Backup</button>
    <button class="util-btn" id="btnRestore" data-i18n="btnRestore">⬆ Restaurar</button>
    <button class="util-btn report" id="btnReport" data-i18n="btnReport">Relatório PDF</button>
    <input type="file" id="restoreFile" accept=".json,application/json" style="display:none;">
  </div>
  <button class="backup-status" id="backupStatus"></button>

  <!-- novo registro -->
  <div class="card form">
    <p class="card-title" data-i18n="formTitle">Novo registro</p>

    <div class="field">
      <span class="field-label" data-i18n="fMachine">Máquina (MC番号)</span>
      <div class="toggle-row" id="fMachines"></div>
    </div>

    <div class="field">
      <label for="fCounter" data-i18n="fCounter">管理No — contador da máquina</label>
      <input type="number" id="fCounter" inputmode="numeric" min="0" step="1">
    </div>

    <div class="field">
      <span class="field-label" data-i18n="fPerson">Responsável (担当)</span>
      <div class="toggle-row" id="fPeople"></div>
    </div>

    <div class="field">
      <label for="fContent" data-i18n="fContent">Alteração (変更内容)</label>
      <textarea id="fContent"></textarea>
      <div class="chips" id="fChips"></div>
    </div>

    <div class="field">
      <span class="field-label" data-i18n="fDate">Data / hora</span>
      <div class="dt-line">
        <span class="dt-now" id="dtNow"></span>
        <button class="dt-toggle" id="dtToggle" data-i18n="dtOther">🕐 Outra data</button>
      </div>
      <div class="dt-custom hidden" id="dtCustomRow">
        <input type="datetime-local" id="dtCustom" style="width:100%; background:#0d0f11; border:1px solid var(--line); color:var(--text); font-family:inherit; font-size:16px; padding:11px; border-radius:6px;">
      </div>
    </div>

    <button class="btn primary" id="btnSave" data-i18n="btnSave">+ Registrar</button>
  </div>

  <!-- lista do mês -->
  <div class="month-nav">
    <button id="listPrev" aria-label="◀">◀</button>
    <span class="m-label" id="listMonthLabel"></span>
    <button id="listNext" aria-label="▶">▶</button>
  </div>
  <span class="list-count" id="listCount"></span>
  <div id="entryList"></div>

  <!-- configurações -->
  <details class="card" id="settingsCard" style="margin-top:20px;">
    <summary data-i18n="settings">⚙ Configurações</summary>

    <div class="grid2">
      <div class="field">
        <label for="sPart" data-i18n="sPart">Peça</label>
        <input type="text" id="sPart">
      </div>
      <div class="field">
        <label for="sPartNo" data-i18n="sPartNo">部番</label>
        <input type="text" id="sPartNo">
      </div>
      <div class="field">
        <label for="sM1" data-i18n="sM1">Máquina 1</label>
        <input type="text" id="sM1">
      </div>
      <div class="field">
        <label for="sM2" data-i18n="sM2">Máquina 2</label>
        <input type="text" id="sM2">
      </div>
      <div class="field">
        <label for="sP1" data-i18n="sP1">Responsável 1</label>
        <input type="text" id="sP1">
      </div>
      <div class="field">
        <label for="sP2" data-i18n="sP2">Responsável 2</label>
        <input type="text" id="sP2">
      </div>
    </div>
    <button class="btn primary" id="btnSaveSettings" data-i18n="btnSaveSettings" style="margin-bottom:18px;">Salvar configurações</button>

    <span class="field-label" data-i18n="favTitle">Frases fixas (★)</span>
    <div id="favList"></div>
    <p class="hint" data-i18n="favHint">Para fixar uma frase, escreva no campo Alteração e toque em "★ Fixar esta frase".</p>
  </details>

  <footer data-i18n="footer">dados salvos automaticamente neste aparelho</footer>
  <div class="app-version" id="appVersion"></div>
</div>

<!-- modal: editar registro -->
<div class="overlay" id="editOverlay">
  <div class="modal">
    <p class="card-title" style="color:var(--blue);" data-i18n="editTitle">Editar registro</p>
    <div class="field">
      <span class="field-label" data-i18n="fMachine">Máquina (MC番号)</span>
      <div class="toggle-row" id="eMachines"></div>
    </div>
    <div class="field">
      <label for="eCounter" data-i18n="fCounter">管理No — contador da máquina</label>
      <input type="number" id="eCounter" inputmode="numeric" min="0" step="1">
    </div>
    <div class="field">
      <span class="field-label" data-i18n="fPerson">Responsável (担当)</span>
      <div class="toggle-row" id="ePeople"></div>
    </div>
    <div class="field">
      <label for="eContent" data-i18n="fContent">Alteração (変更内容)</label>
      <textarea id="eContent"></textarea>
    </div>
    <div class="field">
      <label for="eDate" data-i18n="fDate">Data / hora</label>
      <input type="datetime-local" id="eDate">
    </div>
    <div class="btn-row">
      <button class="btn ghost" id="eCancel" data-i18n="btnCancel">Cancelar</button>
      <button class="btn primary" id="eSave" data-i18n="btnSaveEdit">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- relatório -->
<div id="reportArea">
  <div class="report-toolbar no-print">
    <button class="r-print" id="rPrint" data-i18n="rPrint">Imprimir / Salvar PDF</button>
    <button class="r-close" id="rClose" data-i18n="rClose">✕ Fechar</button>
  </div>
  <div class="month-nav light no-print">
    <button id="repPrev" aria-label="◀">◀</button>
    <span class="m-label" id="reportMonthLabel"></span>
    <button id="repNext" aria-label="▶">▶</button>
  </div>
  <div id="reportSheets"></div>
</div>

<script>
/* ================= constantes ================= */
const APP_ID = 'condicoes-6gr';
const APP_VERSION = 'v2026.11.2';
const ROWS_PER_SHEET = 30;
const BACKUP_WARN_DAYS = 7;
// chaves próprias deste app (o app de ferramentas usa outras chaves no mesmo endereço)
const K_ENTRIES = 'cond6gr_entries_v1';
const K_SETTINGS = 'cond6gr_settings_v1';
const K_LASTBACKUP = 'cond6gr_lastbackup_v1';
const K_LANG = 'cond6gr_lang_v1';
const K_LASTPERSON = 'cond6gr_lastperson_v1';
const K_LASTMACHINES = 'cond6gr_lastmachines_v1';

const DEFAULT_SETTINGS = {
  part: '6GR ボス',
  partNo: '6GR1316100-0002',
  machines: [ { id:'A', name:'MC 5' }, { id:'B', name:'MC 7' } ],
  people: [ 'ヤサノリ', '土井' ],
  phrases: []
};

/* ================= textos ================= */
const I18N = {
  pt: {
    title: (s) => `Condições de Usinagem — ${s.part}`,
    sub: (s) => `部番 ${s.partNo} · registro de alterações`,
    btnBackup: '⬇ Backup', btnRestore: '⬆ Restaurar', btnReport: 'Relatório PDF',
    formTitle: 'Novo registro',
    fMachine: 'Máquina (MC番号)',
    fCounter: '管理No — contador da máquina',
    fPerson: 'Responsável (担当)',
    fContent: 'Alteração (変更内容)',
    fDate: 'Data / hora',
    dtOther: '🕐 Outra data', dtUseNow: '✕ Usar agora',
    dtNowLabel: (s) => `Agora: ${s}`,
    btnSave: '+ Registrar',
    chipsFav: '★ Frases fixas', chipsRecent: 'Recentes',
    pinPhrase: '★ Fixar esta frase',
    pinned: 'Frase fixada ★', pinEmpty: 'Escreva a frase no campo Alteração primeiro.', pinExists: 'Esta frase já está fixada.',
    listMonth: 'Mês',
    listCount: (n) => `${n} ${n === 1 ? 'registro' : 'registros'}`,
    emptyMonth: 'Nenhum registro neste mês.',

/* ================= estado ================= */
let lang = 'pt';
let entries = [];
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let formMachines = ['A'];
let formPerson = null;
let editingId = null;
let editMachines = [];
let editPerson = null;
let listMonth = '';    // 'YYYY-MM'
let reportMonth = '';

function shiftMonth(key, delta){
  const [y, m] = key.split('-').map(Number);
  return localMonthKey(new Date(y, m - 1 + delta, 1));
}
function monthLabel(key){
  const [y, m] = key.split('-').map(Number);
  if(lang === 'ja') return `${y}年${m}月`;
  return new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' });
}

const t = () => I18N[lang];
const $ = (id) => document.getElementById(id);

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str == null ? '' : String(str);
  return d.innerHTML;
}
const pad = (n) => String(n).padStart(2, '0');
function localDateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function localMonthKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1); }
function toDatetimeLocal(d){ return localDateKey(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function hhmm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtDateTime(d){
  return d.toLocaleString(lang === 'pt' ? 'pt-BR' : 'ja-JP',
    { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function machineName(id){
  const m = settings.machines.find(x => x.id === id);
  return m ? m.name : id;
}
function validSettings(s){
  return s && typeof s.part === 'string' && typeof s.partNo === 'string' &&
    Array.isArray(s.machines) && s.machines.length === 2 &&
    s.machines[0].id === 'A' && s.machines[1].id === 'B' &&
    Array.isArray(s.people) && Array.isArray(s.phrases);
}
function validEntry(e){
  return e && typeof e.id === 'string' && typeof e.date === 'string' && !isNaN(new Date(e.date)) &&
    Array.isArray(e.machines) && typeof e.content === 'string';
}

/* ================= armazenamento ================= */
function load(){
  try{
    const raw = JSON.parse(localStorage.getItem(K_ENTRIES) || '[]');
    entries = Array.isArray(raw) ? raw.filter(validEntry) : [];
  } catch(e){ entries = []; }
  try{
    const s = JSON.parse(localStorage.getItem(K_SETTINGS) || 'null');
    if(validSettings(s)) settings = s;
  } catch(e){}
  try{
    const l = localStorage.getItem(K_LANG);
    if(l === 'pt' || l === 'ja') lang = l;
    const p = localStorage.getItem(K_LASTPERSON);
    if(p) formPerson = p;
    const lm = JSON.parse(localStorage.getItem(K_LASTMACHINES) || 'null');
    if(Array.isArray(lm) && lm.length && lm.every(x => x === 'A' || x === 'B')) formMachines = lm;
  } catch(e){}
}
function saveEntries(){ try{ localStorage.setItem(K_ENTRIES, JSON.stringify(entries)); } catch(e){ alert('Erro ao salvar / 保存エラー'); } }
function saveSettings(){ try{ localStorage.setItem(K_SETTINGS, JSON.stringify(settings)); } catch(e){} }
function setPref(k, v){ try{ localStorage.setItem(k, v); } catch(e){} }

function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._h);
  toast._h = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ================= idioma ================= */
function applyLang(){
  const d = t();
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'ja';
  $('btn-pt').classList.toggle('active', lang === 'pt');
  $('btn-ja').classList.toggle('active', lang === 'ja');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const v = d[el.getAttribute('data-i18n')];
    if(typeof v === 'string') el.textContent = v;
  });
  $('appVersion').textContent = APP_VERSION;
  updateDtToggle();
  renderAll();
}
$('btn-pt').addEventListener('click', () => { lang = 'pt'; setPref(K_LANG, lang); applyLang(); });
$('btn-ja').addEventListener('click', () => { lang = 'ja'; setPref(K_LANG, lang); applyLang(); });

/* ================= formulário ================= */
function renderToggles(containerId, selectedMachines, onToggle){
  const el = $(containerId);
  el.innerHTML = settings.machines.map(m =>
    `<button class="toggle${selectedMachines.includes(m.id) ? ' on' : ''}" data-m="${m.id}">${escapeHtml(m.name)}</button>`).join('');
  el.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => onToggle(b.getAttribute('data-m'))));
}
function renderPeople(containerId, selected, onPick){
  const el = $(containerId);
  const list = [...settings.people];
  if(selected && !list.includes(selected)) list.push(selected);
  el.innerHTML = list.map((p, i) =>
    `<button class="toggle person${p === selected ? ' on' : ''}" data-p="${i}">${escapeHtml(p)}</button>`).join('');
  el.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => onPick(list[+b.getAttribute('data-p')])));
}
function toggleIn(arr, id){
  return arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id].sort();
}

function renderForm(){
  renderToggles('fMachines', formMachines, (id) => { formMachines = toggleIn(formMachines, id); renderForm(); });
  renderPeople('fPeople', formPerson, (p) => { formPerson = p; renderForm(); });
  renderChips();
}

function recentPhrases(){
  const seen = new Set(settings.phrases);
  const out = [];
  [...entries].sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(e => {
    const c = e.content.trim();
    if(c && !seen.has(c)){ seen.add(c); out.push(c); }
  });
  return out.slice(0, 6);
}
function renderChips(){
  const d = t();
  const favs = settings.phrases;
  const recents = recentPhrases();
  let html = '';
  if(favs.length){
    html += `<span class="chips-label">${d.chipsFav}</span>`;
    html += favs.map((p, i) => `<button class="chip fav" data-fav="${i}">${escapeHtml(p)}</button>`).join('');
  }
  if(recents.length){
    html += `<span class="chips-label">${d.chipsRecent}</span>`;
    html += recents.map((p, i) => `<button class="chip" data-rec="${i}">${escapeHtml(p)}</button>`).join('');
  }
  html += `<span class="chips-label"></span><button class="chip-tool" id="pinBtn">${d.pinPhrase}</button>`;
  const el = $('fChips');
  el.innerHTML = html;
  el.querySelectorAll('[data-fav]').forEach(b => b.addEventListener('click', () => insertPhrase(favs[+b.getAttribute('data-fav')])));
  el.querySelectorAll('[data-rec]').forEach(b => b.addEventListener('click', () => insertPhrase(recents[+b.getAttribute('data-rec')])));
  $('pinBtn').addEventListener('click', pinPhrase);
}
function insertPhrase(p){
  const ta = $('fContent');
  const cur = ta.value.trim();
  ta.value = cur ? cur + ' / ' + p : p;
  ta.focus();
}
function pinPhrase(){
  const d = t();
  const p = $('fContent').value.trim();
  if(!p){ alert(d.pinEmpty); return; }
  if(settings.phrases.includes(p)){ toast(d.pinExists); return; }
  settings.phrases.push(p);
  saveSettings();
  renderChips();
  renderSettings();
  toast(d.pinned);
}

/* data/hora */
let dtCustomOn = false;
function updateDtToggle(){
  const d = t();
  $('dtToggle').textContent = dtCustomOn ? d.dtUseNow : d.dtOther;
  $('dtToggle').classList.toggle('on', dtCustomOn);
  $('dtCustomRow').classList.toggle('hidden', !dtCustomOn);
  $('dtNow').textContent = dtCustomOn ? '' : d.dtNowLabel(fmtDateTime(new Date()));
}
$('dtToggle').addEventListener('click', () => {
  dtCustomOn = !dtCustomOn;
  if(dtCustomOn) $('dtCustom').value = toDatetimeLocal(new Date());
  updateDtToggle();
});
setInterval(() => { if(!dtCustomOn) updateDtToggle(); }, 30000);

function validateFields(machines, counterStr, person, content){
  const d = t();
  if(!machines.length){ alert(d.errMachine); return false; }
  const n = parseFloat(counterStr);
  if(counterStr === '' || isNaN(n) || n < 0){ alert(d.errCounter); return false; }
  if(!person){ alert(d.errPerson); return false; }
  if(!content.trim()){ alert(d.errContent); return false; }
  return true;
}

$('btnSave').addEventListener('click', () => {
  const counterStr = $('fCounter').value.trim();
  const content = $('fContent').value;
  if(!validateFields(formMachines, counterStr, formPerson, content)) return;
  const date = dtCustomOn && $('dtCustom').value ? new Date($('dtCustom').value) : new Date();
  entries.push({
    id: 'c' + Date.now(),
    date: date.toISOString(),
    machines: [...formMachines],
    counter: parseFloat(counterStr),
    person: formPerson,
    content: content.trim()
  });
  saveEntries();
  setPref(K_LASTPERSON, formPerson);
  setPref(K_LASTMACHINES, JSON.stringify(formMachines));
  $('fCounter').value = '';
  $('fContent').value = '';
  dtCustomOn = false;
  updateDtToggle();
  listMonth = localMonthKey(date);
  renderAll();
  toast(t().saved);
});

/* ================= lista ================= */
function renderList(){
  const d = t();
  const month = listMonth;
  $('listMonthLabel').textContent = monthLabel(month);
  const list = entries.filter(e => localMonthKey(new Date(e.date)) === month)
    .sort((a,b) => new Date(b.date) - new Date(a.date));
  $('listCount').textContent = d.listCount(list.length);
  const el = $('entryList');
  if(list.length === 0){
    el.innerHTML = `<div class="empty">${escapeHtml(entries.length ? d.emptyMonth : d.emptyAll)}</div>`;
    return;
  }
  const locale = lang === 'pt' ? 'pt-BR' : 'ja-JP';
  let html = '', lastDay = '';
  list.forEach(e => {
    const dt = new Date(e.date);
    const day = localDateKey(dt);
    if(day !== lastDay){
      lastDay = day;
      html += `<div class="day-title">${escapeHtml(dt.toLocaleDateString(locale, { weekday:'short', day:'2-digit', month:'2-digit', year:'numeric' }))}</div>`;
    }
    const badges = ['A','B'].filter(m => e.machines.includes(m))
      .map(m => `<span class="mc-badge">${escapeHtml(machineName(m))}</span>`).join('');
    html += `
      <div class="entry">
        <div class="entry-top">
          <span class="entry-time">${hhmm(dt)}</span>
          ${badges}
          <span class="entry-meta">${d.counterShort} <b>${escapeHtml(e.counter)}</b> · ${d.personShort} <b>${escapeHtml(e.person)}</b></span>
        </div>
        <div class="entry-content">${escapeHtml(e.content)}</div>
        <div class="entry-actions">
          <button class="e-edit" data-edit="${e.id}">${d.btnEdit}</button>
          <button class="e-del" data-del="${e.id}">${d.btnDelete}</button>
        </div>
      </div>`;
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEdit(b.getAttribute('data-edit'))));
  el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
    if(!confirm(t().confirmDelete)) return;
    entries = entries.filter(x => x.id !== b.getAttribute('data-del'));
    saveEntries();
    renderAll();
  }));
}
$('listPrev').addEventListener('click', () => { listMonth = shiftMonth(listMonth, -1); renderList(); });
$('listNext').addEventListener('click', () => { listMonth = shiftMonth(listMonth, 1); renderList(); });

/* ================= editar ================= */
function renderEditToggles(){
  renderToggles('eMachines', editMachines, (id) => { editMachines = toggleIn(editMachines, id); renderEditToggles(); });
  renderPeople('ePeople', editPerson, (p) => { editPerson = p; renderEditToggles(); });
}
function openEdit(id){
  const e = entries.find(x => x.id === id);
  if(!e) return;
  editingId = id;
  editMachines = [...e.machines];
  editPerson = e.person;
  $('eCounter').value = e.counter;
  $('eContent').value = e.content;
  $('eDate').value = toDatetimeLocal(new Date(e.date));
  renderEditToggles();
  $('editOverlay').classList.add('open');
}
$('eCancel').addEventListener('click', () => { $('editOverlay').classList.remove('open'); editingId = null; });
$('eSave').addEventListener('click', () => {
  const e = entries.find(x => x.id === editingId);
  if(!e) return;
  const counterStr = String($('eCounter').value).trim();
  const content = $('eContent').value;
  if(!validateFields(editMachines, counterStr, editPerson, content)) return;
  e.machines = [...editMachines];
  e.counter = parseFloat(counterStr);
  e.person = editPerson;
  e.content = content.trim();
  if($('eDate').value) e.date = new Date($('eDate').value).toISOString();
  saveEntries();
  $('editOverlay').classList.remove('open');
  editingId = null;
  renderAll();
  toast(t().updated);
});

/* ================= configurações ================= */
function renderSettings(){
  const d = t();
  $('sPart').value = settings.part;
  $('sPartNo').value = settings.partNo;
  $('sM1').value = settings.machines[0].name;
  $('sM2').value = settings.machines[1].name;
  $('sP1').value = settings.people[0] || '';
  $('sP2').value = settings.people[1] || '';
  const fl = $('favList');
  if(!settings.phrases.length){
    fl.innerHTML = `<p class="hint">${d.favNone}</p>`;
  } else {
    fl.innerHTML = settings.phrases.map((p, i) =>
      `<div class="fav-item"><span>${escapeHtml(p)}</span><button data-unfav="${i}">${d.favRemove}</button></div>`).join('');
    fl.querySelectorAll('[data-unfav]').forEach(b => b.addEventListener('click', () => {
      settings.phrases.splice(+b.getAttribute('data-unfav'), 1);
      saveSettings();
      renderAll();
    }));
  }
}
$('btnSaveSettings').addEventListener('click', () => {
  const vals = ['sPart','sPartNo','sM1','sM2','sP1','sP2'].map(id => $(id).value.trim());
  if(vals.some(v => !v)){ alert(t().settingsEmpty); return; }
  const [part, partNo, m1, m2, p1, p2] = vals;
  const oldPeople = settings.people;
  settings.part = part;
  settings.partNo = partNo;
  settings.machines = [ { id:'A', name: m1 }, { id:'B', name: m2 } ];
  settings.people = [p1, p2];
  // se o responsável escolhido foi renomeado, acompanha o novo nome
  const idx = oldPeople.indexOf(formPerson);
  if(idx >= 0) formPerson = settings.people[idx];
  saveSettings();
  renderAll();
  toast(t().settingsSaved);
});

/* ================= backup / restaurar ================= */
function renderBackupStatus(){
  const d = t();
  const el = $('backupStatus');
  let last = null;
  try{ last = localStorage.getItem(K_LASTBACKUP); } catch(e){}
  el.classList.remove('warn','danger');
  if(!last){ el.textContent = d.backupNever; el.classList.add('danger'); return; }
  const startOf = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const days = Math.round((startOf(new Date()) - startOf(new Date(last))) / 86400000);
  if(days <= 0) el.textContent = d.backupToday;
  else if(days < BACKUP_WARN_DAYS) el.textContent = d.backupDays(days);
  else { el.textContent = d.backupOld(days); el.classList.add('warn'); }
}
function doBackup(){
  const data = { app: APP_ID, version: 1, exportedAt: new Date().toISOString(), settings, entries };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const tag = settings.part.replace(/[^A-Za-z0-9]/g, '') || 'peca';
  a.href = url;
  a.download = `backup-condicoes-${tag}-${localDateKey(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  setPref(K_LASTBACKUP, new Date().toISOString());
  renderBackupStatus();
}
$('btnBackup').addEventListener('click', doBackup);
$('backupStatus').addEventListener('click', doBackup);
$('btnRestore').addEventListener('click', () => $('restoreFile').click());
$('restoreFile').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const d = t();
    let data;
    try{ data = JSON.parse(reader.result); } catch(e){ alert(d.restoreInvalid); ev.target.value = ''; return; }
    if(!data || data.app !== APP_ID){ alert(d.restoreWrongApp); ev.target.value = ''; return; }
    if(!Array.isArray(data.entries) || !data.entries.every(validEntry)){ alert(d.restoreInvalid); ev.target.value = ''; return; }
    const locale = lang === 'pt' ? 'pt-BR' : 'ja-JP';
    const dates = data.entries.map(e => new Date(e.date)).sort((a,b) => a - b);
    const info = {
      date: data.exportedAt ? new Date(data.exportedAt).toLocaleString(locale) : '—',
      count: data.entries.length,
      range: dates.length ? dates[0].toLocaleDateString(locale) + ' – ' + dates[dates.length-1].toLocaleDateString(locale) : '',
      curCount: entries.length
    };
    if(!confirm(d.restoreInfo(info))){ ev.target.value = ''; return; }
    entries = data.entries;
    if(validSettings(data.settings)) settings = data.settings;
    saveEntries();
    saveSettings();
    ev.target.value = '';
    renderAll();
    toast(d.restored);
  };
  reader.readAsText(file);
});

/* ================= relatório (folha A4, em japonês como o formulário oficial) ================= */
function shortMachine(name){
  const s = String(name).replace(/^MC\s*/i, '');
  return s || name;
}
function buildReport(){
  const month = reportMonth;
  $('reportMonthLabel').textContent = monthLabel(month);
  const [y, m] = month.split('-').map(Number);
  const list = entries.filter(e => localMonthKey(new Date(e.date)) === month)
    .sort((a,b) => new Date(a.date) - new Date(b.date));
  const pages = Math.max(1, Math.ceil(list.length / ROWS_PER_SHEET));
  const now = new Date();
  const printed = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}`;
  const mA = escapeHtml(shortMachine(settings.machines[0].name));
  const mB = escapeHtml(shortMachine(settings.machines[1].name));
  let html = '';
  for(let p = 0; p < pages; p++){
    const rows = list.slice(p * ROWS_PER_SHEET, (p + 1) * ROWS_PER_SHEET);
    let body = rows.map(e => {
      const dt = new Date(e.date);
      return `<tr>
        <td class="c">${e.machines.includes('A') ? '✓' : ''}</td>
        <td class="c">${e.machines.includes('B') ? '✓' : ''}</td>
        <td class="r">${escapeHtml(e.counter)}</td>
        <td class="c">${dt.getMonth()+1}/${dt.getDate()}</td>
        <td class="c">${hhmm(dt)}</td>
        <td class="c">${escapeHtml(e.person)}</td>
        <td class="content">${escapeHtml(e.content)}</td>
      </tr>`;
    }).join('');
    for(let i = rows.length; i < ROWS_PER_SHEET; i++){
      body += '<tr><td></td><td></td><td></td><td class="c">/</td><td></td><td></td><td></td></tr>';
    }
    html += `
      <div class="sheet">
        <div class="sheet-title">${escapeHtml(settings.part)} 加工条件変更履歴表</div>
        <div class="sheet-head">
          <span class="partno">部番:${escapeHtml(settings.partNo)}</span>
          <span>${y} 年 ${m} 月${pages > 1 ? `  (${p+1}/${pages})` : ''}</span>
        </div>
        <table>
          <colgroup>
            <col class="col-mc"><col class="col-mc"><col class="col-no"><col class="col-date">
            <col class="col-time"><col class="col-person"><col class="col-content">
          </colgroup>
          <thead>
            <tr>
              <th colspan="2">MC番号</th>
              <th rowspan="2">管理No<br>(加工部品数)</th>
              <th rowspan="2">月/日</th>
              <th rowspan="2">時刻</th>
              <th rowspan="2">担当</th>
              <th rowspan="2">変更内容</th>
            </tr>
            <tr><th>${mA}</th><th>${mB}</th></tr>
          </thead>
          <tbody>${body}</tbody>
        </table>
        <div class="sheet-foot">
          <span>出力日:${printed}</span>
          <span>加工条件変更履歴 ${APP_VERSION}</span>
        </div>
      </div>`;
  }
  $('reportSheets').innerHTML = html;
}
$('btnReport').addEventListener('click', () => {
  reportMonth = listMonth;
  buildReport();
  document.body.classList.add('printing');
  window.scrollTo(0, 0);
});
$('repPrev').addEventListener('click', () => { reportMonth = shiftMonth(reportMonth, -1); buildReport(); });
$('repNext').addEventListener('click', () => { reportMonth = shiftMonth(reportMonth, 1); buildReport(); });
$('rPrint').addEventListener('click', () => window.print());
$('rClose').addEventListener('click', () => { document.body.classList.remove('printing'); window.scrollTo(0, 0); });

/* ================= geral ================= */
function renderAll(){
  const d = t();
  $('hTitle').textContent = d.title(settings);
  $('hSub').textContent = d.sub(settings);
  document.title = `${settings.part} — 加工条件`;
  renderForm();
  renderList();
  renderSettings();
  renderBackupStatus();
  if(document.body.classList.contains('printing')) buildReport();
}

load();
listMonth = localMonthKey(new Date());
reportMonth = listMonth;
applyLang();
</script>
